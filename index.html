   vai parar em cima da figura (o portao de leiaute pegou em 6 fases).      */

/* ===== JOGO DA MEMORIA — GRANDE, COM ARTE E COM EFEITO =====
   Duas ordens do Marcos (ago/2026), no mesmo dia:
   1) *"quando fizer jogo da memória faça cartas maiores"* — a carta e o alvo
      mais dificil da atividade: a crianca precisa VER a figura, LER a palavra e
      ainda LEMBRAR onde ela estava. Carta pequena mata as tres coisas.
   2) *"os jogos da memória tem que ter bastante efeitos e sons, devem ficar
      lindos, tamanho maior, claro adequando a tela, chamar atenção do
      estudante"* — dai a VIRADA de verdade (a carta gira em 3D), o brilho
      dourado que corre pela carta parada, o par que pulsa e a moldura que
      acende. E o verso e ARTE DE IA (regra nova dele), nao um retangulo azul.  */
.mcartas{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;
  gap:11px;-webkit-box-pack:center;justify-content:center;margin-top:12px;max-width:440px;width:100%;
  -webkit-perspective:900px;perspective:900px}
.mcarta{position:relative;width:47%;max-width:206px;min-height:118px;border-radius:16px;cursor:pointer;
  -webkit-transform-style:preserve-3d;transform-style:preserve-3d;
  -webkit-transition:-webkit-transform .42s cubic-bezier(.3,.9,.35,1);
  transition:transform .42s cubic-bezier(.3,.9,.35,1);
  -webkit-box-shadow:0 7px 16px rgba(50,40,20,.3);box-shadow:0 7px 16px rgba(50,40,20,.3)}
/* as duas faces ocupam a MESMA area; quem gira e a carta inteira */
.mcarta .fa{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:16px;overflow:hidden;
  display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;align-items:center;

   depois "use imagens geradas de IA para esses objetos". Ficou o melhor dos
   dois: a beira do rio é uma ILUSTRAÇÃO de verdade (hv_beira, casa enxaimel na
   margem), e a ÁGUA é uma camada de CSS que sobe POR CIMA dela — o que a

.reguario{position:relative;width:100%;max-width:400px;height:auto;margin-top:10px;

/* --- SIMULADOR 2: a água sobe no Vale ---
   O morro era DESENHADO em CSS (retângulo verde + palitinhos). O Marcos olhou o
   outro simulador e disse: "só achei feio o quadradinho, poderia ser outra coisa
   mais bonita... ou use imagens gerada de ia para esses objetos" — e depois
   "pode ser na outra que fala das enchentes também".
   Agora são TRÊS ilustrações do MESMO morro (a segunda e a terceira nasceram

.valebox{position:relative;width:100%;max-width:420px;height:200px;margin-top:10px;

       teclado de verdade, as duas opcoes". No PC da escola tem teclado; no
       celular, nao. As duas portas ficam abertas e levam ao mesmo lugar.     */
    document.onkeydown=function(ev){

      letras.appendChild(b);

    top.appendChild(est); ln.appendChild(top);
    var bar=el("div","bbar"),fi=el("i"); bar.appendChild(fi); ln.appendChild(bar);
    barras.push([fi,Math.max(8,Math.round(p*100)),320+i*260]);
    cx.appendChild(ln); i++;
  }
  /* acertos subindo de 0 ate o total */
  var tot=MED.ev.length,acc=0,z;
  for(z=0;z<MED.ev.length;z++) acc+=MED.ev[z].ok;
  var mins=Math.max(1,Math.round(((new Date()).getTime()-MED.ini)/60000));
  var pl=el("div","bplacar","<b>0</b> acertos");
  cx.appendChild(pl);
  cx.appendChild(el("div","btempo","Voc&#234; trabalhou <b>"+mins+"</b> minuto"+(mins===1?"":"s")+" sem desistir."));
  var frase=(acc>=tot*0.8)?"Voc&#234; foi <b>muito bem</b> do come&#231;o ao fim!":
            ((acc>=tot*0.5)?"Voc&#234; <b>aprendeu bastante</b> hoje. Continua assim!":
                            "Voc&#234; <b>chegou at&#233; o fim</b>. Isso &#233; o que vale!");
  cx.appendChild(el("div","bfrase",frase));
  pai.appendChild(cx);
  /* as barras crescem depois de entrar na tela (senao nao anima) */
  setTimeout(function(){ var q;
    for(q=0;q<barras.length;q++){ (function(b){
      setTimeout(function(){ b[0].style.width=b[1]+"%"; },b[2]);
    })(barras[q]); }
  },60);
  /* o numero de acertos sobe contando */
  if(tot>0){ var v=0,pa=Math.max(28,Math.round(1400/Math.max(1,acc)));
    var tm=setInterval(function(){
      if(!cx.parentNode){ clearInterval(tm); return; }
      v++; if(v>acc){ clearInterval(tm); return; }
      pl.innerHTML="<b>"+v+"</b> acerto"+(v===1?"":"s");
      try{ tom(520+v*8,0.05,"triangle",0.07); }catch(e){}
    },pa);
  }
}

var TREINO={mudanca:hAntesAgora,permanencia:hMudouContinua,tempo:hLinhaTempo,migracao:hPovos,natureza:hEnchente,producao:hCompleta};
function TELAFIM(){ hFim(); }
/* ---------- TREINAR SO O QUE FALTOU ----------
   Pergunta do Marcos (ago/2026): "se ela nao domina, ela consegue fazer so as
   atividades que nao domina?". Da: o app ja mede cada objetivo (DOM). Aqui ele
   monta um percurso CURTO so com as fases dos objetivos fracos e volta para a
   medalha no fim. A crianca nao repete o que ja sabe — isso e o que mantem ela
   na tarefa em vez de enjoar.
   Truque para nao mexer em nenhuma fase: enquanto o treino roda, o mostraBanner
   ignora o "proximo" original e chama a proxima fase da fila.               */
var FILATREINO=null;
var _bannerOriginal=mostraBanner;
mostraBanner=function(msg,cb){ _bannerOriginal(msg, FILATREINO ? proximoTreino : cb); };
function fracos(){
  var k,out=[];
  for(k in DOM){ if(DOM.hasOwnProperty(k)&&(DOM[k]||0)<0.75&&TREINO[k]) out.push(k); }
  return out;
}
function proximoTreino(){
  if(!FILATREINO||!FILATREINO.length){ FILATREINO=null; salva(); TELAFIM(); return; }
  var f=FILATREINO.shift();
  try{ f(); }catch(e){ proximoTreino(); }
}
function treinarFracos(){
  var f=fracos(),i,fila=[];
  for(i=0;i<f.length;i++) fila.push(TREINO[f[i]]);
  if(!fila.length){ TELAFIM(); return; }
  FILATREINO=fila; proximoTreino();
}
